<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory & Orders Demo</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; }
      header { padding: 12px 16px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 8px; }
      header h1 { font-size: 18px; margin: 0; }
      main { padding: 16px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .card { border: 1px solid #eee; border-radius: 8px; padding: 12px; }
      .card h2 { font-size: 16px; margin-top: 0; }
      input, select, button { font-size: 14px; padding: 8px; }
      form { display: grid; gap: 8px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border-bottom: 1px solid #eee; padding: 6px 8px; text-align: left; }
    </style>
  </head>
  <body>
    <header>
      <h1>Inventory & Orders</h1>
      <span style="color:#666">In-memory SQLite demo</span>
    </header>
    <main>
      <div id="root"></div>
    </main>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
